[ABOUT]
NAME = VRC Race Logger
AUTHOR = VRC tooling
VERSION = 1.2
DESCRIPTION = Warcraft-Logs-style continuous race recorder: samples full physics state (position, inputs, per-wheel slip, surfaces, tyres, damage) for EVERY car incl. AI, plus discrete events (collisions, laps, resets, pit stops, flags) via CSP callbacks. Writes one plain-text log per session into <AC root>\logs (chunked during the race, merged on session end, crash-salvaged on next launch). Read-only, no physics writes, no car/track file changes -> league-safe. Offline AI cars run full local physics, so their data is as complete as the player's. Feed the .txt to the offline Python analyzer for incident detection + WCL-style HTML replay report.

[CORE]
LAZY = NONE  ; load at AC start, keep running regardless of window state -> recording never depends on the window being open

[WINDOW_0]
ID = main
NAME = VRC Race Logger
FUNCTION_MAIN = windowMain
SIZE = 420, 380

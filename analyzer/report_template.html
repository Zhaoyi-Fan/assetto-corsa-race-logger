<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRC 比赛报告</title>
<style>
:root{
  --bg:#101318; --bg2:#171b22; --bg3:#1f242e; --line:#2a3140; --fg:#e8ebf0;
  --dim:#9aa3b2; --acc:#3b7ddd; --warn:#f2a93b; --bad:#e8433f; --ok:#39c07a;
  font-size:15px;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--fg); font-family:"Segoe UI",system-ui,sans-serif}
header{padding:14px 22px 10px; border-bottom:1px solid var(--line); background:var(--bg2); position:relative}
#langbtn{position:absolute; top:14px; right:22px}
header h1{font-size:1.25rem; font-weight:600}
.chips{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px}
.chip{background:var(--bg3); border:1px solid var(--line); border-radius:20px;
  padding:2px 11px; font-size:.78rem; color:var(--dim)}
nav{display:flex; gap:4px; padding:8px 22px 0; background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto}
nav button{background:none; border:none; color:var(--dim); font-size:.95rem; padding:9px 16px;
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap}
nav button.on{color:var(--fg); border-bottom-color:var(--acc)}
main{padding:18px 22px}
section{display:none} section.on{display:block}
h2{font-size:1.02rem; margin:14px 0 8px; color:var(--fg)}
table{border-collapse:collapse; width:100%; font-size:.87rem}
th,td{padding:5px 10px; text-align:left; border-bottom:1px solid var(--line)}
th{color:var(--dim); font-weight:500; font-size:.78rem}
tr.dnf td{color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.grid2{display:grid; grid-template-columns:minmax(340px,460px) 1fr; gap:22px; align-items:start}
canvas{display:block}
.panelbox{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:12px}
/* cards */
#cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:14px}
.card{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.card h3{font-size:.95rem; display:flex; align-items:center; gap:8px}
.sev{border-radius:4px; padding:1px 7px; font-size:.75rem; font-weight:700; color:#fff}
.card .meta{color:var(--dim); font-size:.78rem; margin:4px 0 8px; display:flex; gap:10px; flex-wrap:wrap}
.chain{font-size:.82rem; margin:2px 0; color:var(--fg)}
.chain b{font-weight:600}
.evrow{display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--dim); margin:3px 0}
.evbar{height:5px; border-radius:3px; background:var(--acc); flex:0 0 auto}
.card .btns{margin-top:9px}
.btn{background:var(--bg3); color:var(--fg); border:1px solid var(--line); border-radius:6px;
  padding:5px 12px; font-size:.8rem; cursor:pointer}
.btn:hover{border-color:var(--acc)}
.spark{margin-top:8px; background:var(--bg); border-radius:6px}
/* laps tab */
#lapslegend{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.lchip{display:flex; align-items:center; gap:5px; background:var(--bg3); border:1px solid var(--line);
  border-radius:14px; padding:2px 10px; font-size:.78rem; cursor:pointer; user-select:none}
.lchip.off{opacity:.35}
/* driving tab */
select{background:var(--bg3); color:var(--fg); border:1px solid var(--line); border-radius:6px;
  padding:4px 8px; font-size:.82rem}
#drvsel{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0 12px;
  font-size:.84rem; color:var(--dim)}
#drvsel .btn.on{border-color:var(--acc); color:var(--fg)}
#drvlaps{display:flex; flex-wrap:wrap; gap:5px}
.lapchip{background:var(--bg3); border:1px solid var(--line); border-radius:12px; padding:1px 9px;
  font-size:.76rem; cursor:pointer; user-select:none; color:var(--dim)}
.lapchip.on{border-color:var(--acc); color:var(--fg)}
.lapchip.best{color:var(--ok)}
.lapchip.pit{text-decoration:line-through}
.dpos{color:var(--ok)} .dneg{color:var(--bad)}
#telstrip{width:100%; background:var(--bg); border-radius:6px; margin-top:8px}
#ribbon{width:100%; height:44px; background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; margin-top:8px; cursor:pointer; touch-action:none}
/* replay */
#replaywrap{display:grid; grid-template-columns:1fr 275px; gap:14px}
#mapbox{position:relative; background:#0b0e12; border:1px solid var(--line); border-radius:8px; overflow:hidden}
#map{width:100%; height:62vh; cursor:grab; touch-action:none}
#sidebar{display:flex; flex-direction:column; gap:12px}
#leader{max-height:34vh; overflow-y:auto}
#leader table{font-size:.8rem}
#leader td{padding:3px 6px; border-bottom:1px solid #202634}
#telem .big{font-size:1.7rem; font-weight:700}
.bar{height:9px; background:var(--bg3); border-radius:4px; overflow:hidden; margin:3px 0}
.bar i{display:block; height:100%}
.ndgrid{display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:7px}
.nd{border-radius:5px; text-align:center; font-size:.75rem; padding:5px 0; background:var(--bg3)}
#controls{display:flex; align-items:center; gap:10px; margin-top:10px}
#scrub{width:100%; height:56px; background:var(--bg2); border:1px solid var(--line);
  border-radius:8px; cursor:pointer; touch-action:none}
#tlc{width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:8px}
#tip{position:fixed; display:none; background:#000d; border:1px solid var(--line); color:var(--fg);
  font-size:.78rem; padding:6px 9px; border-radius:6px; pointer-events:none; z-index:50; max-width:340px}
.hint{color:var(--dim); font-size:.76rem; margin-top:6px}
.hotrow{display:flex; align-items:center; gap:9px; font-size:.84rem; margin:4px 0}
.hotbar{height:10px; background:var(--bad); border-radius:3px}
/* whole-race corner style panel (v1.4) */
tr.csrow{cursor:pointer}
tr.csrow:hover td{background:var(--bg3)}
tr.csx>td{background:var(--bg2); border:1px solid var(--line); padding:12px 14px}
.csrange{color:var(--dim); font-size:.72rem; margin-left:2px}
.cstbl{font-size:.8rem; width:100%}
.cstbl td,.cstbl th{padding:3px 8px}
.cstbl tr.cssel td{color:var(--fg); font-weight:600}
.csdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}
#cschart{width:100%; margin-top:4px}
@media (max-width:900px){ .grid2{grid-template-columns:1fr} #replaywrap{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1 id="title">VRC Race Report</h1>
  <button class="btn" id="langbtn">EN</button>
  <div class="chips" id="metachips"></div>
</header>
<nav>
  <button data-tab="overview" class="on" data-i18n="tabOverview"></button>
  <button data-tab="laps" data-i18n="tabLaps"></button>
  <button data-tab="driving" data-i18n="tabDriving"></button>
  <button data-tab="timeline" data-i18n="tabTimeline"></button>
  <button data-tab="cards" data-i18n="tabCards"></button>
  <button data-tab="replay" data-i18n="tabReplay"></button>
</nav>
<main>
  <section id="tab-overview" class="on">
    <div class="grid2">
      <div>
        <h2 id="resultsh"></h2>
        <table id="results"></table>
        <h2 data-i18n="pitsH"></h2>
        <div class="panelbox"><table id="pittable"></table></div>
      </div>
      <div>
        <h2 id="lapcharth"></h2>
        <div class="panelbox"><canvas id="lapchart" height="330"></canvas></div>
        <h2 data-i18n="hotspotsH"></h2>
        <div class="panelbox" id="hotspots"></div>
      </div>
    </div>
  </section>

  <section id="tab-laps">
    <h2><span data-i18n="lapTimesH"></span> <span class="hint" data-i18n="legendHint"></span></h2>
    <div id="lapslegend"></div>
    <div class="panelbox"><canvas id="lapline" height="340"></canvas></div>
    <h2 data-i18n="gapH"></h2>
    <div class="panelbox"><canvas id="gapline" height="300"></canvas></div>
    <h2 data-i18n="lapStatsH"></h2>
    <table id="lapstats"></table>
  </section>

  <section id="tab-driving">
    <h2><span data-i18n="drvH"></span> <span class="hint" data-i18n="drvHint"></span></h2>
    <div id="drvsel"></div>
    <div class="panelbox">
      <canvas id="drvspd" height="240"></canvas>
      <canvas id="drvinp" height="110"></canvas>
      <canvas id="drvdelta" height="110"></canvas>
    </div>
    <h2><span data-i18n="drvCornersH"></span> <span class="hint" data-i18n="csHint"></span></h2>
    <table id="drvcorners"></table>
    <div class="grid2" style="margin-top:16px">
      <div>
        <h2 data-i18n="drvStyleH"></h2>
        <table id="drvstyle"></table>
      </div>
      <div>
        <h2><span data-i18n="drvGgH"></span> <span class="hint" data-i18n="drvGgHint"></span></h2>
        <div class="panelbox"><canvas id="drvgg" height="300"></canvas></div>
      </div>
    </div>
    <h2><span data-i18n="drvHeatH"></span> <span class="hint" data-i18n="drvHeatHint"></span></h2>
    <div class="panelbox"><canvas id="drvheat"></canvas></div>
  </section>

  <section id="tab-timeline">
    <h2><span data-i18n="tlH"></span> <span class="hint" data-i18n="tlHint"></span></h2>
    <canvas id="tlc"></canvas>
  </section>

  <section id="tab-cards">
    <h2><span data-i18n="cardsH"></span> <span class="hint" id="cardcount"></span></h2>
    <div id="cards"></div>
    <h2 style="margin-top:20px" data-i18n="allH"></h2>
    <table id="alleps"></table>
  </section>

  <section id="tab-replay">
    <div id="replaywrap">
      <div>
        <div id="mapbox"><canvas id="map"></canvas></div>
        <div id="controls">
          <button class="btn" id="play">▶</button>
          <button class="btn" id="spdbtn">1×</button>
          <button class="btn" id="followbtn">—</button>
          <span id="clock" style="font-variant-numeric:tabular-nums; color:var(--dim)"></span>
        </div>
        <canvas id="scrub"></canvas>
        <canvas id="ribbon"></canvas>
        <div class="hint" data-i18n="replayHint"></div>
      </div>
      <div id="sidebar">
        <div class="panelbox" id="leader"><h2 style="margin-top:0" data-i18n="leaderH"></h2><table></table></div>
        <div class="panelbox" id="telem"><h2 style="margin-top:0" data-i18n="telemH"></h2><div id="telbody"></div>
          <canvas id="telstrip" height="64"></canvas></div>
      </div>
    </div>
  </section>
</main>
<div id="tip"></div>

}

// ---------- replay decoding (async: binary may be zlib-deflated) --------------------
const R = DATA.replay;
const N = R.n, DT = R.dt, CARS = R.cars, STRIDE = R.stride;
let DV = null;   // set by decodeReplay(); guards below skip binary-dependent draws
const X = [], Z = [], HD = [], SPD = [], SPL = [];
const off = (ci, k) => (ci * N + k) * STRIDE;
async function decodeReplay(){
  const s = atob(REPLAY_B64), n = s.length, u = new Uint8Array(n);
  for (let i = 0; i < n; i++) u[i] = s.charCodeAt(i);
  let buf = u.buffer;
  if (R.compressed){
    if (typeof DecompressionStream === "undefined")
      throw new Error("this browser lacks DecompressionStream (need Chrome 80+ / Firefox 113+ / Safari 16.4+)");
    buf = await new Response(
      new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
  }
  DV = new DataView(buf);
  for (let ci = 0; ci < CARS; ci++) {
    const x = new Float32Array(N), z = new Float32Array(N), h = new Float32Array(N),
          s2 = new Float32Array(N), sp = new Float32Array(N);
    for (let k = 0; k < N; k++) {
      const o = off(ci, k);
      x[k] = DV.getFloat32(o, true); z[k] = DV.getFloat32(o + 4, true);
      h[k] = DV.getInt16(o + 8, true) / 1000;
      s2[k] = DV.getUint16(o + 10, true) / 10;
      sp[k] = DV.getUint16(o + 26, true) / 65535;
    }
    X.push(x); Z.push(z); HD.push(h); SPD.push(s2); SPL.push(sp);
  }
}
const chan = {
  gas: (ci,k) => DV.getUint8(off(ci,k)+12) / 255,
  brake: (ci,k) => DV.getUint8(off(ci,k)+13) / 255,
  steer: (ci,k) => DV.getInt16(off(ci,k)+14, true) / 10,
  gear: (ci,k) => DV.getInt8(off(ci,k)+16),
  out: (ci,k) => DV.getUint8(off(ci,k)+17),
  nd: (ci,k,w) => DV.getUint8(off(ci,k)+18+w) / 20,
  surf: (ci,k) => DV.getUint16(off(ci,k)+22, true),
  beta: (ci,k) => DV.getInt16(off(ci,k)+24, true) / 10,
  accX: (ci,k) => DV.getInt16(off(ci,k)+28, true) / 100,
  accZ: (ci,k) => DV.getInt16(off(ci,k)+30, true) / 100,
};
const SURF_ZH = {0:"沥青",1:"人工草",2:"草地",3:"砾石",4:"路肩",5:"旧沥青",6:"沙地",7:"冰",8:"雪"};
const SURF_EN = {0:"asphalt",1:"turf",2:"grass",3:"gravel",4:"kerb",5:"old",6:"sand",7:"ice",8:"snow"};
const surfName = t => (LANG === "zh" ? SURF_ZH : SURF_EN)[t] || "?";
const SURF_COLOR = {0:"#3a4150",1:"#7aa855",2:"#4d9950",3:"#a98a55",4:"#e08a3a",5:"#565d68",6:"#d8c46a",7:"#9fd6e8",8:"#eef4f8"};

// laps: per-car crossing times for lap counting
const lapsBy = Array.from({length: CARS}, () => []);
DATA.laps.forEach(l => lapsBy[l.car].push(l));
lapsBy.forEach(a => a.sort((p,q) => p.t - q.t));
function lapsDone(ci, t){ const a = lapsBy[ci]; let n = 0;
  for (let i = 0; i < a.length && a[i].t <= t; i++) n = a[i].n; return n; }
function progress(ci, k, t){ return lapsDone(ci, t) + SPL[ci][k]; }
const dnfT = {}; Object.entries(DATA.dnfT || {}).forEach(([c,t]) => dnfT[+c] = t);

const fmtT = s => { s = Math.max(0, s); const m = Math.floor(s/60);
  return m + ":" + (s - m*60).toFixed(1).padStart(4, "0"); };
const fmtLap = ms => { if (!ms) return "—"; const m = Math.floor(ms/60000);
  return m + ":" + ((ms - m*60000)/1000).toFixed(3).padStart(6, "0"); };
const carOf = i => DATA.cars[i];
const nameOf = i => carOf(i).driver;
const shortName = i => { const p = nameOf(i).split(" "); return (p[p.length-1] || nameOf(i)).slice(0,3).toUpperCase(); };
const sevColor = s => s >= 80 ? "#e8433f" : s >= 55 ? "#f2703b" : s >= 35 ? "#f2a93b" : "#8fa3c0";

// per-car lap list with in/out-lap marking (clean-lap stats + charts)
const lapsData = (() => {
  const per = Array.from({length: CARS}, () => []);
  DATA.laps.forEach(l => per[l.car].push({n: l.n, ms: l.ms, t: l.t}));
  per.forEach(a => a.sort((p,q) => p.n - q.n));
  per.forEach((a, ci) => a.forEach((l, k) => {
    const tPrev = k ? a[k-1].t : 0;
    l.pit = DATA.pits.some(p => p.car === ci && p.t0 < l.t && p.t1 > tPrev);
  }));
  return per;
})();
const MAXLAP = Math.max(0, ...DATA.laps.map(l => l.n));

function buildOverview(){
  const tb = document.getElementById("results");
  const pole = DATA.results.length ? DATA.results[0].best : 0;
  // start reaction column: race + V1.3+ log + standing start + at least one launch
  const START_OK = IS_RACE && DATA.start && !DATA.start.rolling &&
    DATA.results.some(r => r.react != null || r.jump);
  const bestReact = START_OK ?
    Math.min(...DATA.results.filter(r => r.react != null).map(r => r.react)) : Infinity;
  const reactCell = r => {
    if (r.jump) return `<td style="color:var(--bad)">${T("jumpStart")}</td>`;
    if (r.react == null) return `<td style="color:var(--dim)">${T("reactNone")}</td>`;
    const s = (r.react/1000).toFixed(3) + "s";
    return r.react === bestReact ?
      `<td><b style="color:var(--ok)">${s}</b></td>` : `<td>${s}</td>`;
  };
  tb.innerHTML = `<tr><th>#</th><th>${T("driverCol")}</th><th></th><th>${T("lapsCol")}</th><th>${T("bestCol")}</th>${START_OK ? `<th title="${T("reactHint")}">${T("reactCol")}</th>` : ""}<th>${T(IS_RACE ? "statusCol" : "gapCol")}</th></tr>` +
    DATA.results.map((r,i) => {
      const c = carOf(r.car);
      let status;
      if (r.dnf) status = "DNF";
      else if (IS_RACE) status = T("running");
      else if (!r.best) status = T("noLap");
      else status = i === 0 ? "—" : "+" + ((r.best - pole)/1000).toFixed(3);
      return `<tr class="${r.dnf ? "dnf":""}"><td>${i+1}</td>
        <td><span class="dot" style="background:${c.color}"></span>${esc(c.driver)}</td>
        <td style="color:var(--dim)">${c.ai ? "AI "+(c.aiLevel*100).toFixed(0) : T("player")}</td>
        <td>${r.laps}</td><td>${fmtLap(r.best)}</td>
        ${START_OK ? reactCell(r) : ""}<td>${status}</td></tr>`;
    }).join("");

  const hs = document.getElementById("hotspots");
  const mx = Math.max(1, ...DATA.hotspots.map(h => h.n));
  hs.innerHTML = DATA.hotspots.length ?
    DATA.hotspots.map(h => `<div class="hotrow"><span style="flex:0 0 190px">${esc(LANG==="zh" ? h.corner : (h.cornerEn || h.corner))}</span>
      <span class="hotbar" style="width:${h.n/mx*180}px"></span><b>${h.n}</b> ${T("hotSuffix")}</div>`).join("")
    : `<span class='hint'>${T("hotNone")}</span>`;

  const pt = document.getElementById("pittable");
  const pits = [...DATA.pits].sort((a,b) => a.t0 - b.t0);
  pt.innerHTML = pits.length ?
    `<tr><th>${T("driverCol")}</th><th>${T("pitLapCol")}</th><th>t</th><th>${T("pitDurCol")}</th><th>${T("pitTyreCol")}</th></tr>` +
    pits.map(p => {
      const c = carOf(p.car);
      const tyre = (p.tyreFrom >= 0 && p.tyreTo >= 0)
        ? (p.tyreFrom === p.tyreTo ? `C${p.tyreTo}` : `C${p.tyreFrom} → C${p.tyreTo}`) : "?";
      return `<tr><td><span class="dot" style="background:${c.color}"></span>${esc(c.driver)}</td>
        <td>${p.lap}</td><td>${fmtT(p.t0)}</td><td>${p.dur.toFixed(1)}s</td><td>${tyre}</td></tr>`;
    }).join("")
    : `<tr><td class="hint">${T("noPits")}</td></tr>`;
}
function drawLapChart(){
  const cv = document.getElementById("lapchart");
  const w = cv.parentElement.clientWidth - 24;
  if (w <= 40) return;  // tab hidden: a 0-width redraw leaves a blurry stretched bitmap
  cv.width = w * devicePixelRatio;
  cv.height = 330 * devicePixelRatio; cv.style.width = w + "px"; cv.style.height = "330px";
  const ctx = cv.getContext("2d"); ctx.scale(devicePixelRatio, devicePixelRatio);
  const L = DATA.posByLap.length; if (!L) return;
  const px = l => 34 + (w - 50) * (L === 1 ? 0 : l / (L - 1));
  const py = p => 16 + (330 - 40) * (p - 1) / Math.max(1, DATA.meta.cars - 1);
  ctx.strokeStyle = "#2a3140"; ctx.fillStyle = "#9aa3b2"; ctx.font = "10px sans-serif";
  for (let l = 0; l < L; l++){ ctx.beginPath(); ctx.moveTo(px(l), 12); ctx.lineTo(px(l), 306);
    ctx.stroke(); ctx.fillText("L" + (l+1), px(l)-6, 322); }
  for (let ci = 0; ci < CARS; ci++){
    ctx.strokeStyle = carOf(ci).color; ctx.lineWidth = 1.8; ctx.beginPath(); let started=false;
    for (let l = 0; l < L; l++){
      const p = DATA.posByLap[l].indexOf(ci); if (p < 0) continue;
      if (!started){ ctx.moveTo(px(l), py(p+1)); started=true; } else ctx.lineTo(px(l), py(p+1));
    }
    ctx.stroke();
    for (let l = L-1; l >= 0; l--){ const p = DATA.posByLap[l].indexOf(ci);
      if (p >= 0){ ctx.fillStyle = carOf(ci).color; ctx.fillText(shortName(ci), px(l)+5, py(p+1)+3); break; } }
  }
}

const lapsVisible = new Set();
(function initLapsVisible(){

function _sizeCanvas(cv, h){
  const w = cv.parentElement.clientWidth - 24;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0, 0, w, h);
  return [c, w, h];
}
function drawLapLine(){
  const cv = document.getElementById("lapline");
  if (cv.parentElement.clientWidth <= 40) return;
  const [c, w, h] = _sizeCanvas(cv, 340);
  if (!MAXLAP) return;
  const clean = [];
  lapsData.forEach((a, ci) => { if (lapsVisible.has(ci)) a.forEach(l => { if (!l.pit) clean.push(l.ms); }); });
  if (!clean.length) lapsData.forEach(a => a.forEach(l => clean.push(l.ms)));
  if (!clean.length) return;
  clean.sort((a,b) => a-b);
  const lo = clean[0] * 0.998;
  const hi = Math.min(clean[Math.floor((clean.length-1) * 0.9)] * 1.05, clean[0] * 1.25);
  const px = n => 44 + (w - 96) * (MAXLAP === 1 ? 0 : (n - 1) / (MAXLAP - 1));
  const py = ms => 12 + (h - 44) * (1 - (Math.min(ms, hi) - lo) / (hi - lo));
  c.strokeStyle = "#2a3140"; c.fillStyle = "#9aa3b2"; c.font = "10px sans-serif";
  for (let g = 0; g <= 4; g++){
    const ms = lo + (hi - lo) * g / 4, y = py(ms);
    c.beginPath(); c.moveTo(44, y); c.lineTo(w - 12, y); c.stroke();
    c.fillText(fmtLap(Math.round(ms)), 2, y + 3);
  }
  const step = MAXLAP > 30 ? 5 : MAXLAP > 12 ? 2 : 1;
  for (let n = 1; n <= MAXLAP; n += step) c.fillText("L" + n, px(n) - 6, h - 18);
  for (let ci = 0; ci < CARS; ci++){
    if (!lapsVisible.has(ci)) continue;
    const a = lapsData[ci]; if (!a.length) continue;
    c.strokeStyle = carOf(ci).color; c.lineWidth = 1.7; c.beginPath(); let st = false;
    a.forEach(l => { const x = px(l.n), y = py(l.ms);
      st ? c.lineTo(x, y) : c.moveTo(x, y); st = true; });
    c.stroke();
    a.forEach(l => {
      const x = px(l.n), y = py(l.ms);
      c.fillStyle = carOf(ci).color;
      if (l.ms > hi){ c.strokeStyle = carOf(ci).color; c.lineWidth = 1;
        c.beginPath(); c.arc(x, py(hi), 2.6, 0, 7); c.stroke(); }   // clamped outlier
      else if (l.pit){ c.beginPath(); c.arc(x, y, 2.6, 0, 7); c.stroke(); }
      else { c.beginPath(); c.arc(x, y, 2.2, 0, 7); c.fill(); }
    });
    const last = a[a.length - 1];
    c.fillStyle = carOf(ci).color;
    c.fillText(shortName(ci), Math.min(px(last.n) + 5, w - 32),
               py(Math.min(last.ms, hi)) + 3);
  }
}
function drawGapLine(){
  const cv = document.getElementById("gapline");
  if (cv.parentElement.clientWidth <= 40) return;
  const [c, w, h] = _sizeCanvas(cv, 300);
  if (!MAXLAP) return;
  const base = [];  // earliest crossing time per lap
  for (let n = 1; n <= MAXLAP; n++){
    const ts = DATA.laps.filter(l => l.n === n).map(l => l.t);
    base.push(ts.length ? Math.min(...ts) : null);
  }
  let gmax = 5;
  const series = [];
  for (let ci = 0; ci < CARS; ci++){
    if (!lapsVisible.has(ci)) continue;
    const pts = [];
    lapsData[ci].forEach(l => {
      if (base[l.n - 1] !== null){
        const g = l.t - base[l.n - 1];
        pts.push([l.n, g]);
        if (g > gmax) gmax = g;
      }
    });
    if (pts.length) series.push({ci, pts});
  }
  gmax = Math.min(gmax, 240) * 1.06;
  const px = n => 44 + (w - 96) * (MAXLAP === 1 ? 0 : (n - 1) / (MAXLAP - 1));
  const py = g => 10 + (h - 40) * Math.min(g, gmax) / gmax;
  c.strokeStyle = "#2a3140"; c.fillStyle = "#9aa3b2"; c.font = "10px sans-serif";
  for (let g = 0; g <= 4; g++){
    const gv = gmax * g / 4, y = py(gv);
    c.beginPath(); c.moveTo(44, y); c.lineTo(w - 12, y); c.stroke();
    c.fillText("+" + gv.toFixed(0) + "s", 6, y + 3);
  }
  const step = MAXLAP > 30 ? 5 : MAXLAP > 12 ? 2 : 1;
  for (let n = 1; n <= MAXLAP; n += step) c.fillText("L" + n, px(n) - 6, h - 16);
  series.forEach(s => {
    c.strokeStyle = carOf(s.ci).color; c.lineWidth = 1.7; c.beginPath(); let st = false;
    s.pts.forEach(([n, g]) => { const x = px(n), y = py(g);
      st ? c.lineTo(x, y) : c.moveTo(x, y); st = true; });
    c.stroke();
    const [ln, lg] = s.pts[s.pts.length - 1];
    c.fillStyle = carOf(s.ci).color;
    c.fillText(shortName(s.ci), Math.min(px(ln) + 5, w - 32), py(lg) + 3);
  });
}
function buildLapStats(){
  const tb = document.getElementById("lapstats");
  const rows = DATA.results.map((r, i) => {
    const a = lapsData[r.car];
    const clean = a.filter(l => !l.pit).map(l => l.ms);
    const use = clean.length >= 2 ? clean : a.map(l => l.ms);
    const avg = use.length ? use.reduce((p,q) => p+q, 0) / use.length : 0;
    const sd = use.length > 1 ?
      Math.sqrt(use.reduce((p,q) => p + (q-avg)*(q-avg), 0) / (use.length - 1)) : 0;
    const c = carOf(r.car);
    return `<tr class="${r.dnf ? "dnf" : ""}"><td>${i+1}</td>
      <td><span class="dot" style="background:${c.color}"></span>${esc(c.driver)}</td>
      <td>${a.length}</td><td>${clean.length}</td><td>${fmtLap(r.best)}</td>
      <td>${avg ? fmtLap(Math.round(avg)) : "—"}</td>
      <td>${sd ? (sd/1000).toFixed(3) + "s" : "—"}</td></tr>`;
  }).join("");
  tb.innerHTML = `<tr><th>#</th><th>${T("driverCol")}</th><th>${T("lapsCol")}</th>
    <th>${T("cleanCol")}</th><th>${T("bestCol")}</th><th>${T("avgCol")}</th><th>${T("sigmaCol")}</th></tr>` + rows;
}
function drawLapsTab(){ buildLapsLegend(); drawLapLine(); drawGapLine(); buildLapStats(); }

// ---------- driving analysis (distance-domain lap comparison) -----------------------------
const TRACK_LEN = DATA.meta.trackLenM || 1;
const GRID_M = 5;                      // distance resample step
const DRV = {car: (DATA.cars.find(c => !c.ai) || DATA.cars[0]).i, lap: null,
             refMode: "session", refCar: null, refLap: null};
const drvCache = new Map();
const CORNERS = DATA.track.labels.filter(l => l.s0 !== undefined);

function cleanLaps(ci){ const a = lapsData[ci].filter(l => !l.pit); return a.length ? a : lapsData[ci]; }
function bestLapOf(ci){ const a = cleanLaps(ci);
  return a.length ? a.reduce((p,q) => q.ms < p.ms ? q : p) : null; }
function sessionBest(){ let best = null;
  for (let ci = 0; ci < CARS; ci++){ const b = bestLapOf(ci);
    if (b && (!best || b.ms < best.l.ms)) best = {ci, l: b}; }
  return best; }

function lapChannels(ci, n){
  const key = ci + ":" + n;
  if (drvCache.has(key)) return drvCache.get(key);
  if (!DV) return null;
  const a = lapsBy[ci], end = a.find(l => l.n === n);
  if (!end) return null;
  const prev = a.find(l => l.n === n - 1);
  const w0 = prev ? prev.t : 0;
  const k0 = Math.max(0, Math.ceil(w0/DT)), k1 = Math.min(N-1, Math.floor(end.t/DT));
  if (k1 - k0 < 10) return null;
  // absolute track position; lap 1 starts behind the line -> unwrap the grid run negative
  const x = [];
  for (let k = k0; k <= k1; k++) x.push(SPL[ci][k] * TRACK_LEN);
  let wrapAt = -1;
  for (let i = 1; i < x.length; i++) if (x[i] < x[i-1] - TRACK_LEN/2){ wrapAt = i; break; }
  if (wrapAt > 0) for (let i = 0; i < wrapAt; i++) x[i] -= TRACK_LEN;
  for (let i = 1; i < x.length; i++) if (x[i] < x[i-1]) x[i] = x[i-1];
  const src = {t:[], v:[], gas:[], brk:[], str:[], nd:[], ax:[], az:[]};
  for (let k = k0; k <= k1; k++){
    src.t.push(k*DT - w0);
    src.v.push(SPD[ci][k]);
    src.gas.push(chan.gas(ci,k)); src.brk.push(chan.brake(ci,k));
    src.str.push(chan.steer(ci,k));
    src.nd.push(Math.max(chan.nd(ci,k,0), chan.nd(ci,k,1), chan.nd(ci,k,2), chan.nd(ci,k,3)));
    src.ax.push(chan.accX(ci,k)); src.az.push(chan.accZ(ci,k));
  }
  const M = Math.floor(TRACK_LEN / GRID_M);
  const out = {ci, n, ms: end.ms, absT0: w0, d: new Float32Array(M)};
  for (const f in src) out[f] = new Float32Array(M);
  let j = 0;
  for (let m = 0; m < M; m++){
    const d = m * GRID_M;
    while (j < x.length - 2 && x[j+1] < d) j++;
    const f = x[j+1] > x[j] ? Math.min(1, Math.max(0, (d - x[j])/(x[j+1] - x[j]))) : 0;
    for (const kf in src) out[kf][m] = src[kf][j] + (src[kf][j+1] - src[kf][j]) * f;
    out.d[m] = d;
  }
  const tAnchor = out.t[0];
  for (let m = 0; m < M; m++) out.t[m] -= tAnchor;
  out.absT0 = w0 + tAnchor;
  drvCache.set(key, out);
  return out;
}

const DRVC = {L: 46, R: 14};
let drvCrossD = -1;
function drvSize(id, h){
  const cv = document.getElementById(id);
  const w = cv.parentElement.clientWidth - 26;
  if (w <= 40) return null;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0, 0, w, h);
  return [c, w, h];
}
function drvBands(c, w, h, labels){
  const px = d => DRVC.L + (w - DRVC.L - DRVC.R) * d / TRACK_LEN;
  CORNERS.forEach(l => {
    const x0 = px(l.s0 * TRACK_LEN), x1 = px(l.s1 * TRACK_LEN);
    c.fillStyle = "#ffffff08"; c.fillRect(x0, 0, Math.max(2, x1 - x0), h);
    if (labels){ c.fillStyle = "#8b93a2"; c.font = "9px sans-serif";
      c.fillText("T" + l.n, x0 + 2, 10); }
  });
  if (drvCrossD >= 0){
    c.strokeStyle = "#e8ebf066"; c.beginPath();
    c.moveTo(px(drvCrossD), 0); c.lineTo(px(drvCrossD), h); c.stroke();
  }
  return px;
}
function drvLine(c, px, py, ch, field, color, lw){
  c.strokeStyle = color; c.lineWidth = lw; c.beginPath();
  for (let m = 0; m < ch.d.length; m++){
    const X = px(ch.d[m]), Y = py(ch[field][m]);
    m ? c.lineTo(X, Y) : c.moveTo(X, Y);
  }
  c.stroke();
}
function drawDrvCharts(A, B){
  const s = drvSize("drvspd", 240);
  if (!s) return;
  {
    const [c, w, h] = s;
    const px = drvBands(c, w, h, true);
    let vmax = 100;
    for (const ch of [A, B]) if (ch) for (const v of ch.v) if (v > vmax) vmax = v;
    const py = v => 14 + (h - 34) * (1 - v / (vmax * 1.04));
    c.strokeStyle = "#232a38"; c.fillStyle = "#9aa3b2"; c.font = "9px sans-serif";
    for (let g = 0; g <= 4; g++){ const v = vmax * g / 4, y = py(v);
      c.beginPath(); c.moveTo(DRVC.L, y); c.lineTo(w - DRVC.R, y); c.stroke();
      c.fillText(v.toFixed(0), 8, y + 3); }
    if (B) drvLine(c, px, py, B, "v", "#8b93a2", 1.2);
    if (A) drvLine(c, px, py, A, "v", carOf(A.ci).color, 1.8);
    c.fillStyle = "#9aa3b2";
    c.fillText("km/h", 8, 10);
  }
  const si = drvSize("drvinp", 110);
  if (si){
    const [c, w, h] = si;
    const px = drvBands(c, w, h, false);
    const py = v => 6 + (h - 12) * (1 - v);
    if (B){ drvLine(c, px, py, B, "gas", "#39c07a55", 1); drvLine(c, px, py, B, "brk", "#e8433f55", 1); }
    if (A){ drvLine(c, px, py, A, "gas", "#39c07a", 1.6); drvLine(c, px, py, A, "brk", "#e8433f", 1.6); }
  }
  const sd = drvSize("drvdelta", 110);
  if (sd){
    const [c, w, h] = sd;
    const px = drvBands(c, w, h, false);
    if (A && B && !(A.ci === B.ci && A.n === B.n)){
      const M = Math.min(A.d.length, B.d.length);
      const dl = new Float32Array(M);
      for (let m = 0; m < M; m++) dl[m] = A.t[m] - B.t[m];
      for (let m = 1; m < M - 1; m++) dl[m] = (dl[m-1] + dl[m] + dl[m+1]) / 3;   // light smooth
      let dmax = 0.2; for (const v of dl) if (Math.abs(v) > dmax) dmax = Math.abs(v);
      const py = v => h/2 - (h/2 - 8) * v / (dmax * 1.05);
      c.strokeStyle = "#39424f"; c.beginPath(); c.moveTo(DRVC.L, h/2); c.lineTo(w - DRVC.R, h/2); c.stroke();
      c.fillStyle = "#9aa3b2"; c.font = "9px sans-serif";
      c.fillText("+" + dmax.toFixed(2) + "s", 6, 12); c.fillText("-" + dmax.toFixed(2) + "s", 6, h - 5);
      c.beginPath();
      for (let m = 0; m < M; m++){ const X = px(A.d[m]), Y = py(dl[m]); m ? c.lineTo(X, Y) : c.moveTo(X, Y); }
      c.lineTo(px(A.d[M-1]), h/2); c.lineTo(px(A.d[0]), h/2); c.closePath();
      c.fillStyle = "#e8433f2a"; c.fill();
      c.beginPath();
      for (let m = 0; m < M; m++){ const X = px(A.d[m]), Y = py(dl[m]); m ? c.lineTo(X, Y) : c.moveTo(X, Y); }
      c.strokeStyle = "#f2a93b"; c.lineWidth = 1.5; c.stroke();
      drawDrvCharts._delta = {d: A.d, dl};
    } else {
      c.fillStyle = "#6b7482"; c.font = "11px sans-serif";
      c.fillText(A && B ? T("drvSame") : "", DRVC.L + 10, h/2);
      drawDrvCharts._delta = null;
    }
  }
}

["drvspd", "drvinp", "drvdelta"].forEach(id => {

// -- corner table -------------------------------------------------------------------
function cornerMetrics(ch, l, prevExitD){
  const d0 = l.s0 * TRACK_LEN, d1 = l.s1 * TRACK_LEN;
  const i0 = Math.max(0, Math.floor(d0 / GRID_M));
  const i1 = Math.min(ch.d.length - 1, Math.ceil(d1 / GRID_M));
  if (i1 <= i0) return null;
  let apexI = i0;
  for (let i = i0; i <= i1; i++) if (ch.v[i] < ch.v[apexI]) apexI = i;
  let bp = null;
  // scan back max 400 m but never into the previous corner's braking zone
  const scanFrom = Math.max(0, d0 - 400, prevExitD ?? 0);
  for (let i = Math.floor(scanFrom / GRID_M); i <= apexI; i++)
    if (ch.brk[i] > 0.15){ bp = ch.d[i]; break; }
  let thr = null;
  for (let i = apexI; i <= Math.min(ch.d.length - 1, i1 + Math.floor(300 / GRID_M)); i++)
    if (ch.gas[i] > 0.9){ thr = ch.d[i]; break; }
  return {brakePt: bp === null ? null : d0 - bp, entry: ch.v[i0], apex: ch.v[apexI],
          thrAfter: thr === null ? null : thr - ch.d[apexI], time: ch.t[i1] - ch.t[i0]};
}
function prevExit(i){ return i > 0 ? CORNERS[i-1].s1 * TRACK_LEN : 0; }
function brakeStability(ci){
  const per = CORNERS.map(() => []);
  cleanLaps(ci).forEach(l => {
    const ch = lapChannels(ci, l.n);
    if (!ch) return;
    CORNERS.forEach((c, i) => {
      const m = cornerMetrics(ch, c, prevExit(i));
      if (m && m.brakePt !== null) per[i].push(m.brakePt);
    });
  });
  return per.map(a => {
    if (a.length < 2) return null;
    const avg = a.reduce((p,q) => p+q, 0) / a.length;
    return Math.sqrt(a.reduce((p,q) => p + (q-avg)*(q-avg), 0) / (a.length - 1));
  });
}
function fmtD(v, ref, unit, invert){
  if (v === null) return "—";
  let s = v.toFixed(unit === "s" ? 2 : 0) + (unit || "");
  if (ref !== null && ref !== undefined){
    const d = v - ref;
    if (Math.abs(d) >= (unit === "s" ? 0.02 : 1)){
      const good = invert ? d < 0 : d > 0;
      s += ` <span class="${good ? "dpos" : "dneg"}">(${d >= 0 ? "+" : ""}${d.toFixed(unit === "s" ? 2 : 0)})</span>`;
    }
  }
  return s;
}
function buildCornerTable(A, B){
  const tb = document.getElementById("drvcorners");
  csOpen = -1;
  if (!A){ tb.innerHTML = ""; return; }
  const sameLap = B && A.ci === B.ci && A.n === B.n;
  const stab = brakeStability(A.ci);
  const cs = DATA.cornerStyle;
  tb.innerHTML = `<tr><th>${T("colCorner")}</th><th>${T("colBrakePt")}</th><th>${T("colEntry")}</th>
    <th>${T("colApex")}</th><th>${T("colThrottle")}</th><th>${T("colTime")}</th><th>${T("colStab")}</th></tr>` +
    CORNERS.map((l, i) => {
      const a = cornerMetrics(A, l, prevExit(i));
      const b = B && !sameLap ? cornerMetrics(B, l, prevExit(i)) : null;
      if (!a) return "";
      const click = cs && cs.corners[i] ? ` class="csrow" data-k="${i}"` : "";
      return `<tr${click}><td>T${l.n} ${esc(l.name || "")}</td>
        <td>${fmtD(a.brakePt, b?.brakePt, " m")}</td>
        <td>${fmtD(a.entry, b?.entry, "")}</td>
        <td>${fmtD(a.apex, b?.apex, "")}</td>
        <td>${fmtD(a.thrAfter, b?.thrAfter, " m", true)}</td>
        <td>${fmtD(a.time, b?.time, "s", true)}</td>
        <td>${stab[i] === null ? "—" : "±" + stab[i].toFixed(0) + " m"}</td></tr>`;
    }).join("");
  tb.querySelectorAll("tr.csrow").forEach(tr =>
    tr.addEventListener("click", () => toggleCsPanel(+tr.dataset.k, tr)));
}

// -- whole-race corner style panel (payload.cornerStyle, report v1.4) -----------------
let csOpen = -1;
function toggleCsPanel(k, tr){

const csName = () => nameOf(DRV.car);
function csFmt(v, dg){
  return v ? `${v[0].toFixed(dg)} <span class="csrange">${v[1].toFixed(dg)}..${v[2].toFixed(dg)}</span>` : "—";
}
function renderCsPanel(k){
  const cs = DATA.cornerStyle, C = cs.corners[k], el = document.getElementById("cspanel");
  if (!C || (!C.ref && !C.field)){ el.innerHTML = `<span class="hint">${T("csNone")}</span>`; return; }
  let colName = csName(), col = C.drivers[colName], note = "";
  if (!col && C.ref){
    if (colName !== cs.refName) note = T("csNoDrv", {sel: esc(colName), ref: esc(cs.refName)});
    colName = cs.refName; col = C.ref;
  }
  const fld = C.field;
  const hints = C.hints.length
    ? `<div class="hint">${T("csHints")}: ${C.hints.map(h => `[${esc(h.sec)}] ${esc(h.txt)}`).join(" · ")}</div>` : "";
  const ROWS = [["csBrakePt","brake_m",0],["csBrakeSpeed","v_brake",0],["csBrakePeak","brake_peak",2],
    ["csRelease","release_m",0],["csEntry","v_entry",0],["csVmin","v_min",0],["csVminAt","v_min_m",0],
    ["csExit","v_exit",0],["csGas50","gas50_m",0],["csGas90","full_m",0],["csSpin","spin_s",2],
    ["csPartSpin","part_spin_s",2],["csSlide","slide_s",2],["csKerb","kerb_s",2],["csOff","off_s",2],
    ["csTime","time_s",2,true]];
  let mt = `<table class="cstbl"><tr><th></th><th>${esc(colName)}</th><th>${T("csField")}</th><th>${T("csDelta")}</th></tr>`;
  for (const [key, f, dg, inv] of ROWS){
    const a = col && col[f], b = fld && fld[f];
    let d = "—";
    if (a && b){
      const dv = a[0] - b[0];
      d = `${dv >= 0 ? "+" : ""}${dv.toFixed(dg)}`;
      if (inv && Math.abs(dv) >= 0.02) d = `<span class="${dv < 0 ? "dpos" : "dneg"}">${d}</span>`;
    }
    mt += `<tr><td>${T(key)}</td><td>${csFmt(a, dg)}</td><td>${csFmt(b, dg)}</td><td>${d}</td></tr>`;

function drawCsChart(C, cs){

  if (!src) return;
  const n = src.speed.length, G = P.gridM, X = m => 8 + (m / ((n - 1) * G)) * (w - 16);
  const vmax = Math.max(...(ref ? ref.speed : []), ...(fld ? fld.speed : []), 50) * 1.06;
  const yV = v => 14 + (1 - v / vmax) * (h - 32);          // left axis: speed
  const RMAX = 2.5;
  const yR = v => 14 + (1 - Math.min(v, RMAX) / RMAX) * (h - 32);  // right axis: 0..2.5
  c.strokeStyle = "#232a38"; c.fillStyle = "#6b7482"; c.font = "9px sans-serif";
  for (let v = 0; v <= vmax; v += 100){

    c.fillStyle = "#e8a33d88"; c.fillText(h2.sec, X(h2.m0) + 2, 22);

    c.strokeStyle = "#4a5568"; c.setLineDash([3, 3]);

    c.fillStyle = "#6b7482"; c.fillText(lab, X(m) + 2, h - 20);
  }
  c.strokeStyle = "#e8a33d55"; c.setLineDash([2, 4]);       // nd = 1.0 grip peak
  c.beginPath(); c.moveTo(8, yR(1)); c.lineTo(w - 8, yR(1)); c.stroke(); c.setLineDash([]);
  const line = (arr, y, col, dash) => {

    line(fld.nd_rear, yR, "#e8a33d88", true);
  }
  if (ref){
    line(ref.speed, yV, refColor, false);

    line(ref.gas, yR, "#2fbf71", false);

}

// -- style metrics / G-G / heatmap ----------------------------------------------------
function styleMetrics(ch){
  if (!ch) return null;
  const M = ch.d.length;
  let coast = 0, wot = 0, trail = 0, slip = 0, apps = 0, moving = 0;
  for (let m = 0; m < M; m++){
    if (ch.v[m] > 50) moving++;
    if (ch.gas[m] < 0.05 && ch.brk[m] < 0.05 && ch.v[m] > 50) coast++;
    if (ch.gas[m] > 0.95) wot++;
    if (ch.brk[m] > 0.1 && Math.abs(ch.str[m]) > 25) trail++;
    if (ch.nd[m] > 1.1) slip++;
    if (m && ch.brk[m] > 0.15 && ch.brk[m-1] <= 0.15) apps++;
  }
  const pc = x => (100 * x / Math.max(1, moving)).toFixed(1) + "%";
  return {coast: pc(coast), wot: (100*wot/M).toFixed(1) + "%",
          trail: (100*trail/M).toFixed(1) + "%", slip: (100*slip/M).toFixed(1) + "%",
          apps: String(apps)};
}
function buildStyleTable(A, B){

    rows.map(([key, f]) => `<tr><td>${T(key)}</td><td>${a[f]}</td><td>${b ? b[f] : ""}</td></tr>`).join("");
}
function drawGG(A, B){

const HEAT_SEG = 20;
function drawHeatmap(){
  const cv = document.getElementById("drvheat");
  const laps = lapsData[DRV.car];
  const rowH = 20, labW = 88;
  const w = cv.parentElement.clientWidth - 26;
  if (w <= 40 || !laps.length){ cv.height = 0; return; }
  const h = laps.length * rowH + 26;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const c = cv.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0, 0, w, h);
  const segT = laps.map(l => {
    const ch = lapChannels(DRV.car, l.n);
    if (!ch) return null;
    const out = [];
    for (let s = 0; s < HEAT_SEG; s++){
      const i0 = Math.min(ch.d.length - 1, Math.round(s / HEAT_SEG * ch.d.length));
      const i1 = Math.min(ch.d.length - 1, Math.round((s+1) / HEAT_SEG * ch.d.length));
      out.push({t: ch.t[i1] - ch.t[i0], abs: ch.absT0 + ch.t[i0]});
    }

    best.push(b);

    c.fillText(`L${l.n} ${fmtLap(l.ms)}${l.pit ? " ⛽" : ""}`, 2, y + 13);
    if (!segT[i]) return;

      const x = labW + s * cellW;

      drawHeatmap._cells.push({x, y: y + 2, w: cellW, h: rowH - 5, abs: segT[i][s].abs});
    }
  });

  for (let s = 0; s < HEAT_SEG; s += 2)

// ---------- map / replay ------------------------------------------------------------------
const map = document.getElementById("map"), mctx = map.getContext("2d");
let view = {s: 1, ox: 0, oy: 0};       // world->screen: sx = (x-ox)*s
let follow = null, selected = 0, playing = false, speedMult = 1, simT = 0;
const trackB = (() => { // bounds
  let xs = DATA.track.left.concat(DATA.track.right);
  const mnx = Math.min(...xs.map(p=>p[0])), mxx = Math.max(...xs.map(p=>p[0]));
  const mnz = Math.min(...xs.map(p=>p[1])), mxz = Math.max(...xs.map(p=>p[1]));
  return {mnx, mxx, mnz, mxz};
})();
let mapW = 0, mapH = 0, mapInit = false;
function sizeMap(){
  const box = document.getElementById("mapbox");
  const w = box.clientWidth, h = Math.max(360, window.innerHeight * 0.62);
  if (w <= 50) return;  // tab hidden: clientWidth is 0 — retry when actually shown
  if (mapInit && w === mapW && h === mapH) return;  // tab switch: keep zoom/pan
  mapW = w; mapH = h;
  map.width = mapW * devicePixelRatio; map.height = mapH * devicePixelRatio;
  map.style.width = mapW + "px"; map.style.height = mapH + "px";
  if (!mapInit){ fitView(); mapInit = true; }
  buildStatic();
}
function fitView(){
  const pad = 30;
  const sx = (mapW - 2*pad) / (trackB.mxx - trackB.mnx);
  const sz = (mapH - 2*pad) / (trackB.mxz - trackB.mnz);
  view.s = Math.min(sx, sz);
  view.ox = trackB.mnx - ((mapW/view.s) - (trackB.mxx - trackB.mnx))/2;
  view.oy = trackB.mnz - ((mapH/view.s) - (trackB.mxz - trackB.mnz))/2;
}
const W2SX = x => (x - view.ox) * view.s, W2SY = z => (z - view.oy) * view.s;
// static track painting, shared by the offscreen bitmap (idle) and per-frame
// vector drawing (follow mode — rebuilding a bitmap every frame thrashed GC)
function drawTrackInto(c){
  c.beginPath();
  DATA.track.left.forEach((p,i) => i ? c.lineTo(W2SX(p[0]), W2SY(p[1])) : c.moveTo(W2SX(p[0]), W2SY(p[1])));
  for (let i = DATA.track.right.length - 1; i >= 0; i--){
    const p = DATA.track.right[i]; c.lineTo(W2SX(p[0]), W2SY(p[1]));
  }
  c.closePath(); c.fillStyle = "#232a35"; c.fill();
  c.strokeStyle = "#39424f"; c.lineWidth = 1; c.stroke();
  c.beginPath(); c.setLineDash([4,6]);
  DATA.track.center.forEach((p,i) => i ? c.lineTo(W2SX(p[0]), W2SY(p[1])) : c.moveTo(W2SX(p[0]), W2SY(p[1])));
  c.strokeStyle = "#39424f88"; c.stroke(); c.setLineDash([]);
  c.fillStyle = "#e8ebf0"; const sf = DATA.track.sf;
  c.fillRect(W2SX(sf[0])-4, W2SY(sf[1])-4, 8, 8);
  c.font = "11px sans-serif";
  DATA.track.labels.forEach(l => {
    c.fillStyle = "#9aa3b2"; c.fillText(`T${l.n}`, W2SX(l.x)+7, W2SY(l.z)-4);
    c.fillStyle = "#6b7482"; c.fillText(l.name, W2SX(l.x)+7, W2SY(l.z)+8);
  });
  DATA.episodes.filter(e=>e.isCard).forEach(e => {
    const x = W2SX(e.x), y = W2SY(e.z);
    c.fillStyle = sevColor(e.sev) + "cc";
    c.beginPath(); c.moveTo(x, y-7); c.lineTo(x+5, y); c.lineTo(x, y+7); c.lineTo(x-5, y);
    c.closePath(); c.fill();
  });

let staticCv = null;
function buildStatic(){
  if (!staticCv) staticCv = document.createElement("canvas");
  staticCv.width = map.width; staticCv.height = map.height;
  const c = staticCv.getContext("2d"); c.scale(devicePixelRatio, devicePixelRatio);
  drawTrackInto(c);
}
function idxAt(t){ return Math.max(0, Math.min(N - 1.001, t / DT)); }
function lerpAngle(a, b, f){ let d = b - a;
  while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return a + d*f; }
function carState(ci, t){
  const fi = idxAt(t), k = Math.floor(fi), f = fi - k, k2 = Math.min(N-1, k+1);
  return { x: X[ci][k] + (X[ci][k2]-X[ci][k])*f, z: Z[ci][k] + (Z[ci][k2]-Z[ci][k])*f,
           hd: lerpAngle(HD[ci][k], HD[ci][k2], f), spd: SPD[ci][k] + (SPD[ci][k2]-SPD[ci][k])*f, k };
}
function drawMap(){
  if (!DV) return;
  const c = mctx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,map.width,map.height);
  if (follow !== null){
    const st = carState(follow, simT);
    view.ox = st.x - mapW/(2*view.s); view.oy = st.z - mapH/(2*view.s);
    c.scale(devicePixelRatio, devicePixelRatio);
    drawTrackInto(c);            // vectors, no offscreen rebuild per frame
  } else {
    c.drawImage(staticCv, 0, 0);
    c.scale(devicePixelRatio, devicePixelRatio);
  }
  const trailS = 2.6, steps = 14;
  for (let ci = 0; ci < CARS; ci++){
    const dnfed = dnfT[ci] !== undefined && simT > dnfT[ci] + 2;
    const st = carState(ci, simT);
    const x = W2SX(st.x), y = W2SY(st.z);
    if (!dnfed){ // trail
      c.lineWidth = 2;
      for (let q = steps; q >= 1; q--){
        const tt = simT - trailS*q/steps; if (tt < 0) continue;
        const a = carState(ci, tt), b = carState(ci, tt + trailS/steps);
        c.strokeStyle = carOf(ci).color + Math.round(40*(1-q/steps)+15).toString(16).padStart(2,"0");
        c.beginPath(); c.moveTo(W2SX(a.x), W2SY(a.z)); c.lineTo(W2SX(b.x), W2SY(b.z)); c.stroke();

    }
    c.globalAlpha = dnfed ? 0.25 : 1;
    c.fillStyle = carOf(ci).color;
    c.beginPath(); c.arc(x, y, ci === 0 ? 6 : 5, 0, 7); c.fill();
    if (!dnfed){
      c.beginPath();

      c.lineTo(x + 5*Math.sin(st.hd + 2.2), y + 5*Math.cos(st.hd + 2.2));
      c.lineTo(x + 5*Math.sin(st.hd - 2.2), y + 5*Math.cos(st.hd - 2.2));

}
// map interactions: pointer events (mouse + touch + pinch)
const pointers = new Map();
let pinchD0 = 0, pinchS0 = 1, dragMoved = false;
map.addEventListener("pointerdown", e => {
  map.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.offsetX, y: e.offsetY});
  if (pointers.size === 1) dragMoved = false;
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinchD0 = Math.hypot(a.x - b.x, a.y - b.y); pinchS0 = view.s;
  }
});
map.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.offsetX - p.x, dy = e.offsetY - p.y;
  p.x = e.offsetX; p.y = e.offsetY;
  if (pointers.size === 1){
    if (Math.abs(dx) + Math.abs(dy) >= 1){
      dragMoved = true;
      view.ox -= dx/view.s; view.oy -= dy/view.s;
      setFollow(null, true); buildStatic();
    }
  } else if (pointers.size === 2 && pinchD0 > 0){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
    const wx = mx/view.s + view.ox, wy = my/view.s + view.oy;
    view.s = Math.max(0.05, Math.min(30, pinchS0 * d / pinchD0));
    view.ox = wx - mx/view.s; view.oy = wy - my/view.s;
    dragMoved = true;
    setFollow(null, true); buildStatic();
  }

function dropPointer(e){ pointers.delete(e.pointerId); if (pointers.size < 2) pinchD0 = 0; }
map.addEventListener("pointerup", dropPointer);
map.addEventListener("pointercancel", dropPointer);
map.addEventListener("click", e => {
  if (dragMoved){ dragMoved = false; return; }  // a drag ended here — not a select
  if (!DV) return;
  let best = null, bd = 14;
  for (let ci = 0; ci < CARS; ci++){
    const st = carState(ci, simT);
    const d = Math.hypot(W2SX(st.x) - e.offsetX, W2SY(st.z) - e.offsetY);

  if (e.code === "Space"){ e.preventDefault(); play(); }
  if (e.code === "ArrowRight") seek(simT + (e.shiftKey ? 10 : 1));
  if (e.code === "ArrowLeft") seek(simT - (e.shiftKey ? 10 : 1));
});
function seek(t){ simT = Math.max(0, Math.min(durS, t)); }
let lastTs = 0;
function loop(ts){
  const dt = Math.min(0.1, (ts - lastTs)/1000 || 0); lastTs = ts;
  if (playing){ simT += dt * speedMult; if (simT >= durS){ simT = durS; play(false); } }
  if (document.getElementById("tab-replay").classList.contains("on")){
    drawMap(); drawScrub(); drawRibbon(); updatePanels(); drawTelStrip();
  }
  requestAnimationFrame(loop);
}

// ---------- scrubber ------------------------------------------------------------------------
const scrub = document.getElementById("scrub");
let scrubW = 0;
function sizeScrub(){
  const w = scrub.parentElement.clientWidth;
  if (w <= 50) return;  // tab hidden
  scrubW = w;
  scrub.width = scrubW * devicePixelRatio; scrub.height = 56 * devicePixelRatio;
  scrub.style.height = "56px";
}
function drawScrub(){
  if (scrubW <= 50) return;
  const c = scrub.getContext("2d");
  c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0,0,scrubW,56);
  const px = t => 6 + (scrubW - 12) * t / durS;
  DATA.cautions.forEach(([a,b]) => { c.fillStyle = "#f2a93b2e";
    c.fillRect(px(a), 4, Math.max(2, px(b)-px(a)), 34); });
  c.strokeStyle = "#2a3140"; c.beginPath(); c.moveTo(6, 22); c.lineTo(scrubW-6, 22); c.stroke();
  DATA.posByLap.forEach((cars, li) => {
    const l = DATA.laps.find(x => x.car === cars[0] && x.n === li + 1);
    if (!l) return;
    c.strokeStyle = "#39424f"; c.beginPath(); c.moveTo(px(l.t), 12); c.lineTo(px(l.t), 32); c.stroke();
    c.fillStyle = "#6b7482"; c.font = "9px sans-serif"; c.fillText("L"+(li+1), px(l.t)-6, 10);
  });
  DATA.episodes.forEach(e => {
    const x = px(e.t0), r = e.isCard ? 3 + e.sev/28 : 2.2;
    c.fillStyle = sevColor(e.sev); c.beginPath(); c.arc(x, 22, r, 0, 7); c.fill();
  });
  DATA.pits.forEach(p => { c.fillStyle = "#4fd1e0";
    c.fillRect(px(p.t0)-1.5, 40, 3, 8); });
  c.strokeStyle = "#e8ebf0"; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(px(simT), 2); c.lineTo(px(simT), 54); c.stroke();
}
function scrubSeek(e){
  const r = scrub.getBoundingClientRect();
  seek((e.clientX - r.left - 6) / (scrubW - 12) * durS);
}

// full-race throttle/brake ribbon for the selected car (navigation + rhythm view)
const ribbon = document.getElementById("ribbon");
let ribbonW = 0, ribbonCar = -1, ribbonCv = null;
function sizeRibbon(){
  const w = ribbon.parentElement.clientWidth;
  if (w <= 50) return;
  ribbonW = w;
  ribbon.width = w * devicePixelRatio; ribbon.height = 44 * devicePixelRatio;
  ribbonCar = -1;   // force rebuild at the new size
}
function buildRibbon(){
  ribbonCar = selected;
  if (!ribbonCv) ribbonCv = document.createElement("canvas");
  ribbonCv.width = ribbon.width; ribbonCv.height = ribbon.height;
  const c = ribbonCv.getContext("2d");
  c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const mid = 22;
  for (let px = 0; px < ribbonW; px++){
    const kA = Math.floor(px / ribbonW * (N-1));
    const kB = Math.min(N-1, Math.floor((px+1) / ribbonW * (N-1)));
    let g = 0, b = 0;
    for (let k = kA; k <= kB; k++){
      const gg = chan.gas(ribbonCar, k), bb = chan.brake(ribbonCar, k);
      if (gg > g) g = gg;
      if (bb > b) b = bb;
    }
    c.fillStyle = "#39c07a"; c.fillRect(px, mid - g*19, 1, g*19);
    c.fillStyle = "#e8433f"; c.fillRect(px, mid, 1, b*19);
  }
  c.fillStyle = "#9aa3b2"; c.font = "9px sans-serif";
  c.fillText(shortName(ribbonCar), 4, 10);
}
function drawRibbon(){
  if (!DV || ribbonW <= 0) return;
  if (selected !== ribbonCar) buildRibbon();
  const c = ribbon.getContext("2d");
  c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0, 0, ribbonW, 44);
  c.drawImage(ribbonCv, 0, 0, ribbonW, 44);
  const x = simT / durS * ribbonW;
  c.strokeStyle = "#e8ebf0"; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 44); c.stroke();
}
let ribbonScrubbing = false;
ribbon.addEventListener("pointerdown", e => {
  ribbon.setPointerCapture(e.pointerId); ribbonScrubbing = true;
  const r = ribbon.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * durS);
});
ribbon.addEventListener("pointermove", e => {
  if (!ribbonScrubbing) return;
  const r = ribbon.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * durS);
});
ribbon.addEventListener("pointerup", () => { ribbonScrubbing = false; });
ribbon.addEventListener("pointercancel", () => { ribbonScrubbing = false; });

// live input strip (last 12 s of the selected car) under the telemetry panel
function drawTelStrip(){
  const strip = document.getElementById("telstrip");
  const w = strip.parentElement.clientWidth - 26;
  if (w <= 40 || !DV) return;
  // resize (clears the canvas) only on real layout changes, not 1px jitter
  const targetW = Math.round(w * devicePixelRatio);
  if (Math.abs(strip.width - targetW) > 2){
    strip.width = targetW; strip.height = 64 * devicePixelRatio;
    strip.style.width = w + "px"; strip.style.height = "64px";
  }
  const c = strip.getContext("2d");
  c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0, 0, w, 64);
  const SPAN = 12, ci = selected;
  // interpolate between samples: nearest-sample lookup makes pixel columns flip
  // between adjacent 15 Hz samples as simT advances (temporal aliasing = strobing)
  const path = (get, color, lw) => {
    c.strokeStyle = color; c.lineWidth = lw; c.beginPath();
    let started = false;
    for (let px = 0; px <= w; px++){
      const t = simT - SPAN + px / w * SPAN;
      if (t < 0){ started = false; continue; }
      const fi = Math.min(N - 1.001, Math.max(0, t / DT));
      const k = Math.floor(fi), f = fi - k;
      const y = get(k) * (1 - f) + get(k + 1) * f;
      started ? c.lineTo(px, y) : c.moveTo(px, y);
      started = true;
    }
    c.stroke();
  };
  path(k => 32 - chan.steer(ci, k) / 180 * 26, "#8b93a2", 1);          // steer, centered
  path(k => 60 - chan.gas(ci, k) * 56, "#39c07a", 1.5);                 // throttle
  path(k => 60 - chan.brake(ci, k) * 56, "#e8433f", 1.5);               // brake
  c.strokeStyle = "#e8ebf055";
  c.beginPath(); c.moveTo(w - 1, 0); c.lineTo(w - 1, 64); c.stroke();
  c.fillStyle = "#6b7482"; c.font = "8px sans-serif";
  c.fillText("-" + SPAN + "s", 3, 8);
}
let scrubbing = false;
scrub.addEventListener("pointerdown", e => {
  scrub.setPointerCapture(e.pointerId); scrubbing = true; scrubSeek(e);
});
scrub.addEventListener("pointermove", e => {
  if (scrubbing){ scrubSeek(e); return; }
  const r = scrub.getBoundingClientRect();
  const t = (e.clientX - r.left - 6) / (scrubW - 12) * durS;
  const near = DATA.episodes.filter(x => Math.abs(x.t0 - t) < durS/90);
  showTip(e.clientX, e.clientY, near.length ?
    near.map(x => `<b>${fmtT(x.t0)}</b> ${esc(epTitle(x))}`).join("<br>") : null);
});
scrub.addEventListener("pointerup", () => { scrubbing = false; });
scrub.addEventListener("pointercancel", () => { scrubbing = false; });
scrub.addEventListener("mouseleave", () => showTip(0,0,null));

// ---------- side panels ------------------------------------------------------------------------
function updatePanels(){
  if (!DV) return;
  const lead = updatePanels._leadLap;
  document.getElementById("clock").textContent =
    fmtT(simT) + " / " + fmtT(durS)
    + (lead ? `  ·  L${lead}${DATA.meta.lapsPlanned ? "/" + DATA.meta.lapsPlanned : ""}` : "")
    + (speedMult>1 ? ` (${speedMult}×)` : "");
  // leaderboard at ~5 Hz
  if (!updatePanels._n || performance.now() - updatePanels._n > 200){
    updatePanels._n = performance.now();
    const k = Math.floor(idxAt(simT));
    const rows = [];
    for (let ci = 0; ci < CARS; ci++){
      rows.push({ci, prog: progress(ci, k, simT), dnf: dnfT[ci] !== undefined && simT > dnfT[ci]});
    }
    rows.sort((a,b) => (a.dnf - b.dnf) || (b.prog - a.prog));
    updatePanels._leadLap = rows.length && !rows[0].dnf ? lapsDone(rows[0].ci, simT) + 1 : null;
    document.querySelector("#leader table").innerHTML = rows.map((r,i) => {
      let gap = "";
      if (r.dnf) gap = "OUT";
      else if (i > 0 && !rows[0].dnf){
        const dp = rows[0].prog - r.prog;
        const v = Math.max(SPD[r.ci][k], 40) / 3.6;
        gap = "+" + (dp * DATA.meta.trackLenM / v).toFixed(1) + "s";
        if (dp > 1) gap = T("lapsPlus", {n: Math.floor(dp)});
      }
      const inPit = DATA.pits.some(p => p.car === r.ci && simT >= p.t0 - 6 && simT <= p.t1 + 6);
      return `<tr style="${r.ci === selected ? "background:#232a3a" : ""}" onclick="selCar(${r.ci})">
        <td>${i+1}</td><td><span class="dot" style="background:${carOf(r.ci).color}"></span>${esc(nameOf(r.ci).slice(0,16))}</td>
        <td style="color:var(--dim)">${inPit && !r.dnf ? "PIT" : gap}</td></tr>`;
    }).join("");
  }
  // telemetry text at ~10 Hz (a full innerHTML rewrite every frame churns layout
  // around the live strip below); the strip itself stays per-frame
  if (updatePanels._t2 && performance.now() - updatePanels._t2 < 100
      && updatePanels._lastCi === selected) return;
  updatePanels._t2 = performance.now();
  updatePanels._lastCi = selected;
  const ci = selected, k = Math.floor(idxAt(simT));
  const st = carState(ci, simT);
  const gear = chan.gear(ci,k), beta = chan.beta(ci,k), out = chan.out(ci,k);
  const surf = chan.surf(ci,k);
  const wn = ["FL","FR","RL","RR"];
  const ndHtml = wn.map((w,j) => {
    const v = chan.nd(ci,k,j);
    const sType = (surf >> (12 - 4*j)) & 0xF;
    const col = v >= 1.1 ? "#e8433f" : v >= 0.85 ? "#f2a93b" : "#39c07a";
    return `<div class="nd" style="border:1px solid ${col}">
      ${w} ${v.toFixed(2)}<br><span style="color:${SURF_COLOR[sType]||"#888"}">${surfName(sType)}</span></div>`;
  }).join("");
  const gtxt = gear === 0 ? "N" : gear === -1 ? "R" : gear;
  const gearHtml = LANG === "zh" ? `<b>${gtxt}</b> 挡` : `gear <b>${gtxt}</b>`;
  document.getElementById("telbody").innerHTML = `
    <div style="margin-bottom:4px"><span class="dot" style="background:${carOf(ci).color}"></span>
      <b>${esc(nameOf(ci))}</b> <span class="hint">${carOf(ci).ai ? "AI" : T("player")}</span></div>
    <span class="big">${st.spd.toFixed(0)}</span> km/h
    ${gearHtml}　β ${beta.toFixed(1)}°
    ${out ? `　<span style="color:var(--warn)">${T("wheelsOut", {n: out})}</span>` : ""}
    <div class="bar"><i style="width:${chan.gas(ci,k)*100}%;background:var(--ok)"></i></div>
    <div class="bar"><i style="width:${chan.brake(ci,k)*100}%;background:var(--bad)"></i></div>
    <div class="hint">${T("pedals")}　${T("steer")} ${chan.steer(ci,k).toFixed(0)}°</div>
    <div class="ndgrid">${ndHtml}</div>
    <div class="hint" style="margin-top:5px">${T("ndLegend")}</div>`;
}
window.selCar = ci => { selected = ci; if (follow !== null) setFollow(ci); };

// ---------- timeline tab (per-car swimlanes + weather strip) -----------------------------------
const tlc = document.getElementById("tlc");
const TL = {axis: 22, rowH: 24, label: 74, wx: 34, pad: 8};
let tlDots = [];   // hit-test cache: {x, y, ep}
function tlRowOrder(){ return DATA.results.map(r => r.car); }
function drawTimeline(){
  const w = tlc.parentElement.clientWidth - 4;
  if (w <= 40) return;  // tab hidden
  const wxOn = DATA.weather && DATA.weather.t.length > 1;
  const h = TL.axis + CARS * TL.rowH + (wxOn ? TL.wx + 14 : 0) + TL.pad;
  tlc.width = w * devicePixelRatio; tlc.height = h * devicePixelRatio;
  tlc.style.width = w + "px"; tlc.style.height = h + "px";
  const c = tlc.getContext("2d"); c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  c.clearRect(0,0,w,h);
  const x0 = TL.label, x1 = w - 10;
  const px = t => x0 + (x1 - x0) * t / durS;
  const order = tlRowOrder();
  const rowY = i => TL.axis + i * TL.rowH + TL.rowH / 2;
  const lanesH = CARS * TL.rowH;

  // caution bands behind everything
  DATA.cautions.forEach(([a,b]) => { c.fillStyle = "#f2a93b1f";
    c.fillRect(px(a), TL.axis - 4, Math.max(2, px(b)-px(a)), lanesH + 8); });
  // leader lap ticks + axis labels
  DATA.posByLap.forEach((cars, li) => {
    const l = DATA.laps.find(x => x.car === cars[0] && x.n === li + 1);
    if (!l) return;
    c.strokeStyle = "#232a38"; c.beginPath();
    c.moveTo(px(l.t), TL.axis - 4); c.lineTo(px(l.t), TL.axis + lanesH); c.stroke();
    if (li % (DATA.posByLap.length > 30 ? 5 : 1) === 0 || li === DATA.posByLap.length - 1){
      c.fillStyle = "#6b7482"; c.font = "9px sans-serif"; c.fillText("L"+(li+1), px(l.t)-6, TL.axis - 8);
    }
  });
  tlDots = [];
  order.forEach((ci, i) => {
    const y = rowY(i);
    const dnfAt = dnfT[ci];
    // lane base line (grey after DNF)
    c.strokeStyle = "#222834"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x0, y); c.lineTo(dnfAt !== undefined ? px(dnfAt) : x1, y); c.stroke();
    if (dnfAt !== undefined){
      c.strokeStyle = "#1a1f28";
      c.beginPath(); c.moveTo(px(dnfAt), y); c.lineTo(x1, y); c.stroke();
      c.fillStyle = "#6b7482"; c.font = "9px sans-serif"; c.fillText("✕", px(dnfAt) - 3, y + 3);
    }
    // label
    c.fillStyle = carOf(ci).color; c.beginPath(); c.arc(9, y, 4, 0, 7); c.fill();
    c.fillStyle = "#9aa3b2"; c.font = "10px sans-serif";
    c.fillText(shortName(ci), 18, y + 3);
    // pit blocks
    DATA.pits.filter(p => p.car === ci).forEach(p => {
      c.fillStyle = "#4fd1e0";
      c.fillRect(px(p.t0), y - 5, Math.max(2.5, px(p.t1) - px(p.t0)), 10);
    });
    // episode dots
    DATA.episodes.forEach(e => {
      if (!e.cars.includes(ci)) return;
      const x = px(e.t0), r = e.isCard ? 3 + e.sev/30 : 2.2;
      c.fillStyle = sevColor(e.sev); c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
      tlDots.push({x, y, ep: e});
    });
  });
  // weather strip: grip line + rain fill
  if (wxOn){
    const wy0 = TL.axis + lanesH + 12, wh = TL.wx;
    const wt = DATA.weather;
    const g0 = Math.min(...wt.grip), g1 = Math.max(...wt.grip);
    const rmax = Math.max(0.001, ...wt.rain);
    c.fillStyle = "#3b7ddd22";
    c.beginPath(); c.moveTo(px(wt.t[0]), wy0 + wh);
    wt.t.forEach((tt, i) => c.lineTo(px(tt), wy0 + wh - (wt.rain[i]/Math.max(rmax, 0.2)) * wh));
    c.lineTo(px(wt.t[wt.t.length-1]), wy0 + wh); c.closePath();
    if (rmax > 0.005) c.fill();
    c.strokeStyle = "#39c07a"; c.lineWidth = 1.2; c.beginPath();
    wt.t.forEach((tt, i) => {
      const y = wy0 + wh - (g1 > g0 ? (wt.grip[i]-g0)/(g1-g0) : 0.5) * (wh - 4) - 2;
      i ? c.lineTo(px(tt), y) : c.moveTo(px(tt), y);
    });
    c.stroke();
    c.fillStyle = "#6b7482"; c.font = "9px sans-serif";
    c.fillText(T("wxLabel", {g0: (g0*100).toFixed(1), g1: (g1*100).toFixed(1),
                             r: rmax > 0.005 ? rmax.toFixed(2) : "0"}), x0, wy0 + wh + 11);
  }
}
function tlHit(e){
  const r = tlc.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const near = tlDots.filter(d => Math.hypot(d.x - mx, d.y - my) < 8)
                     .sort((a,b) => Math.hypot(a.x-mx, a.y-my) - Math.hypot(b.x-mx, b.y-my));
  return near.map(d => d.ep);
}
tlc.addEventListener("click", e => {
  const eps = tlHit(e);
  if (eps.length) goReplay(eps[0].t0 - 8, eps[0].chain.length ? eps[0].chain[0].car : eps[0].cars[0]);
});
tlc.addEventListener("mousemove", e => {
  const eps = tlHit(e);
  showTip(e.clientX, e.clientY, eps.length ?
    eps.slice(0,4).map(x => `<b>${fmtT(x.t0)} L${x.lap}</b> ${esc(epTitle(x))}`).join("<br>") : null);
});
tlc.addEventListener("mouseleave", () => showTip(0,0,null));

// ---------- tooltip ----------------------------------------------------------------------
const tip = document.getElementById("tip");
function showTip(x, y, html){
  if (!html){ tip.style.display = "none"; return; }
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.min(x + 14, innerWidth - 360) + "px";
  tip.style.top = (y + 14) + "px";
}

// ---------- language switch + boot ------------------------------------------------------------
function setLang(l){
  LANG = l;
  try { localStorage.setItem("vrcLang", l); } catch(e){}
  document.documentElement.lang = l === "zh" ? "zh" : "en";
  document.getElementById("langbtn").textContent = "LANG: " + (l === "zh" ? "EN" : "中文");
  applyStatic(); buildHeader(); buildOverview(); buildCards();
  play(playing);            // refresh play/pause label
  setFollow(follow, true);  // refresh follow label
  if (document.getElementById("tab-cards").classList.contains("on")) drawSparks();
  if (document.getElementById("tab-timeline").classList.contains("on")) drawTimeline();
  if (document.getElementById("tab-laps").classList.contains("on")) drawLapsTab();
  if (document.getElementById("tab-driving").classList.contains("on")) renderDriving();
}
document.getElementById("langbtn").onclick = () => setLang(LANG === "zh" ? "en" : "zh");

window.addEventListener("resize", () => {
  if (document.getElementById("tab-overview").classList.contains("on")) drawLapChart();
  if (document.getElementById("tab-cards").classList.contains("on")) drawSparks();
  if (document.getElementById("tab-replay").classList.contains("on")){ sizeMap(); sizeScrub(); sizeRibbon(); }
  if (document.getElementById("tab-timeline").classList.contains("on")) drawTimeline();
  if (document.getElementById("tab-laps").classList.contains("on")) drawLapsTab();
  if (document.getElementById("tab-driving").classList.contains("on")) renderDriving();
});

setLang(LANG);   // static UI renders immediately; replay unlocks when decoded
drawLapChart();
decodeReplay().then(() => {
  sizeMap(); sizeScrub();
  if (location.hash) applyHash();
  if (document.getElementById("tab-driving").classList.contains("on")) renderDriving();
  requestAnimationFrame(loop);
}).catch(err => {
  document.querySelector("main").insertAdjacentHTML("afterbegin",
    `<div style="padding:12px;border:1px solid var(--bad);border-radius:8px;margin-bottom:12px">
     replay decode failed: ${esc(String(err))}</div>`);
});
</script>
